<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-title-dl svg-desc-dl">

  <title id="svg-title-dl">Stack Cross-Section — Engineering Map (light theme)</title>
  <desc id="svg-desc-dl">Light-theme isometric cross-section of a software system showing four architectural layers (Frontend, Backend, Data, AI/ML) with 3D depth, plus a Web3 branch level with the Data layer. Amber project probes trace actual coverage, each project's code badge sitting on the top edge of its real entry layer: CC enters at Frontend and spans Frontend–Backend–Data; WSA enters at Backend and spans Backend–Data; AMR enters at Backend and spans Backend–Data–AI/ML; OC enters at Backend and runs Backend–Data then over an arc bridge into Web3 as one continuous path.</desc>

  <defs>
    <filter id="layer-shadow-dl" x="-5%" y="-5%" width="115%" height="130%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#1F2937" flood-opacity="0.18"/>
    </filter>
    <filter id="oc-glow-dl" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="probe-glow-dl" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Top-face clips so label knockout panels can't spill past a slab edge -->
    <clipPath id="clip-fe-dl"><polygon points="80,155 530,65 600,100 150,190"/></clipPath>
    <clipPath id="clip-be-dl"><polygon points="80,245 530,155 600,190 150,280"/></clipPath>
    <clipPath id="clip-da-dl"><polygon points="80,335 530,245 600,280 150,370"/></clipPath>
    <clipPath id="clip-ai-dl"><polygon points="80,425 530,335 600,370 150,460"/></clipPath>
  </defs>

  <!-- Background — off-white -->
  <rect width="800" height="600" fill="#F4F5F7"/>

  <!-- ── HEADER ── -->
  <text x="48" y="35" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="12" fill="#9BA4B1" letter-spacing="2">ENGINEERING MAP</text>
  <text x="48" y="62" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="22" fill="#1F2937" font-weight="bold" letter-spacing="0.5">stack cross-section</text>
  <rect x="48" y="69" width="60" height="2" rx="1" fill="#F59E0B"/>

  <!-- ── LEGEND ── -->
  <g transform="translate(586, 24)" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace">
    <rect x="0" y="0" width="14" height="14" rx="2" fill="#CAD3E0" stroke="#8492A6" stroke-width="1.5"/>
    <text x="21" y="11.5" font-size="10.5" fill="#4A5563">CORE</text>
    <rect x="0" y="21" width="14" height="14" rx="2" fill="#E1E6EE" stroke="#9AA3B0" stroke-width="1.5"/>
    <text x="21" y="32.5" font-size="10.5" fill="#4A5563">WORKING WITH</text>
    <rect x="0" y="42" width="14" height="14" rx="2" fill="none" stroke="#9AA3B0" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="21" y="53.5" font-size="10.5" fill="#4A5563">EXPLORING</text>
    <line x1="0" y1="73" x2="14" y2="73" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="7" cy="73" r="4" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="21" y="76.5" font-size="10.5" fill="#4A5563">PROBE</text>
  </g>

  <!-- ──────────────────────────────────────────────
       STRONG ISOMETRIC LAYERS  (geometry identical to D-dark / Variant C)

       Layer y_base values:
         Frontend : 155   Backend : 245   Data : 335   AI/ML : 425
       Per-layer technology lists omitted from the map (Project Index + README).
  ────────────────────────────────────────────── -->

  <!-- FRONTEND — CORE (solid fill) -->
  <g id="layer-frontend" filter="url(#layer-shadow-dl)">
    <polygon points="80,185 530,95 600,130 150,220" fill="#C3CCDA" stroke="none"/>
    <polygon points="530,65 600,100 600,130 530,95" fill="#D2DAE5" stroke="#A6B0BE" stroke-width="1.2"/>
    <polygon points="80,155 530,65 600,100 150,190" fill="#E4E9F1" stroke="#8492A6" stroke-width="1.8"/>
  </g>

  <!-- BACKEND — CORE (solid fill) -->
  <g id="layer-backend" filter="url(#layer-shadow-dl)">
    <polygon points="80,275 530,185 600,220 150,310" fill="#C5CEDB" stroke="none"/>
    <polygon points="530,155 600,190 600,220 530,190" fill="#D4DCE6" stroke="#A6B0BE" stroke-width="1.2"/>
    <polygon points="80,245 530,155 600,190 150,280" fill="#E6EBF2" stroke="#8492A6" stroke-width="1.8"/>
  </g>

  <!-- DATA — WORKING WITH (slightly lighter, solid border) -->
  <g id="layer-data" filter="url(#layer-shadow-dl)">
    <polygon points="80,365 530,275 600,310 150,400" fill="#CED6E0" stroke="none"/>
    <polygon points="530,245 600,280 600,310 530,280" fill="#DCE2EB" stroke="#A6B0BE" stroke-width="1.2"/>
    <polygon points="80,335 530,245 600,280 150,370" fill="#EDF0F5" stroke="#94A0B0" stroke-width="1.8"/>
  </g>

  <!-- AI/ML — EXPLORING (dashed, minimal fill) -->
  <g id="layer-aiml" filter="url(#layer-shadow-dl)">
    <polygon points="80,455 530,365 600,400 150,490" fill="#F2F4F7" stroke="none" opacity="0.6"/>
    <polygon points="530,335 600,370 600,400 530,370" fill="#F2F4F7" stroke="#AEB8C6" stroke-width="1.2" stroke-dasharray="4,3"/>
    <polygon points="80,425 530,335 600,370 150,460" fill="#F2F4F7" stroke="#AEB8C6" stroke-width="1.8" stroke-dasharray="5,3"/>
  </g>

  <!-- ── WEB3 BRANCH (EXPLORING) — level with Data, per §16 ── -->
  <g id="web3-branch">
    <polygon points="620,308 718,268 758,290 660,330" fill="#F2F4F7" stroke="#94A0B0" stroke-width="1.5" stroke-dasharray="5,3"/>
    <polygon points="718,268 758,290 758,308 718,286" fill="#E7EBF1" stroke="#AEB8C6" stroke-width="1" stroke-dasharray="4,3"/>
    <polygon points="620,308 718,286 758,308 660,330" fill="#DCE2EB" stroke="none" opacity="0.5"/>
    <text x="650" y="306" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="14" fill="#5C6674" letter-spacing="1.5" font-weight="bold">WEB3</text>
    <text x="650" y="320" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="9" fill="#707988">EXPLORING</text>
    <text x="624" y="348" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="10" fill="#707988">Solidity · Arbitrum</text>
  </g>

  <!-- ── LEFT EDGE DEPTH MARKER ── -->
  <line x1="78" y1="155" x2="78" y2="460" stroke="#C4CBD4" stroke-width="2"/>
  <g stroke="#AAB3C0" stroke-width="1">
    <line x1="73" y1="155" x2="83" y2="155"/>
    <line x1="73" y1="245" x2="83" y2="245"/>
    <line x1="73" y1="335" x2="83" y2="335"/>
    <line x1="73" y1="425" x2="83" y2="425"/>
    <line x1="73" y1="460" x2="83" y2="460"/>
  </g>
  <text transform="translate(60,432) rotate(-90)" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="9" fill="#9BA4B1" letter-spacing="1.5">DEPTH</text>

  <!-- ──────────────────────────────────────────────
       PROJECT PROBES — AMBER PATHS   (identical layout to D-dark)

       Probe x positions:  CC=178   WSA=278   AMR=376   OC=468
       Entry edges:  CC → Frontend (178,135)   WSA → Backend (278,205)
                     AMR → Backend (376,186)   OC → Backend (468,167)
       Every badge sits above its real entry-layer edge, joined to a
       solid entry node on that edge by a short stub.
  ────────────────────────────────────────────── -->

  <g id="projects">

    <!-- CC: Frontend → Backend → Data -->
    <g id="probe-cc" filter="url(#probe-glow-dl)">
      <line x1="178" y1="135" x2="178" y2="346" stroke="#F59E0B" stroke-width="2.5" opacity="0.95"/>
      <circle cx="178" cy="155" r="5" fill="#F4F5F7" stroke="#F59E0B" stroke-width="2.5"/>
      <circle cx="178" cy="245" r="5" fill="#F4F5F7" stroke="#F59E0B" stroke-width="2.5"/>
      <circle cx="178" cy="335" r="5" fill="#F4F5F7" stroke="#F59E0B" stroke-width="2.5"/>
    </g>
    <!-- CC badge — entry node on the Frontend top edge -->
    <circle cx="178" cy="135" r="3.5" fill="#F59E0B"/>
    <line x1="178" y1="123" x2="178" y2="135" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
    <rect x="159" y="101" width="38" height="22" rx="3" fill="#F59E0B"/>
    <text x="165" y="117" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="13" fill="#241A02" font-weight="bold">CC</text>

    <!-- WSA: Backend → Data -->
    <g id="probe-wsa" filter="url(#probe-glow-dl)">
      <line x1="278" y1="205" x2="278" y2="326" stroke="#F59E0B" stroke-width="2.5" opacity="0.95"/>
      <circle cx="278" cy="245" r="5" fill="#F4F5F7" stroke="#F59E0B" stroke-width="2.5"/>
      <circle cx="278" cy="335" r="5" fill="#F4F5F7" stroke="#F59E0B" stroke-width="2.5"/>
    </g>
    <!-- WSA badge — entry node on the Backend top edge (stub a touch longer to clear BACKEND) -->
    <circle cx="278" cy="205" r="3.5" fill="#F59E0B"/>
    <line x1="278" y1="191" x2="278" y2="205" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
    <rect x="252" y="169" width="48" height="22" rx="3" fill="#F59E0B"/>
    <text x="258" y="185" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="13" fill="#241A02" font-weight="bold">WSA</text>

    <!-- AMR: Backend → Data → AI/ML -->
    <g id="probe-amr" filter="url(#probe-glow-dl)">
      <line x1="376" y1="186" x2="376" y2="398" stroke="#F59E0B" stroke-width="2.5" opacity="0.95"/>
      <circle cx="376" cy="245" r="5" fill="#F4F5F7" stroke="#F59E0B" stroke-width="2.5"/>
      <circle cx="376" cy="335" r="5" fill="#F4F5F7" stroke="#F59E0B" stroke-width="2.5"/>
      <circle cx="376" cy="425" r="5" fill="#F4F5F7" stroke="#F59E0B" stroke-width="2.5"/>
    </g>
    <!-- AMR badge — entry node on the Backend top edge -->
    <circle cx="376" cy="186" r="3.5" fill="#F59E0B"/>
    <line x1="376" y1="174" x2="376" y2="186" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
    <rect x="352" y="152" width="48" height="22" rx="3" fill="#F59E0B"/>
    <text x="358" y="168" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="13" fill="#241A02" font-weight="bold">AMR</text>

    <!-- OC: Backend → Data → bridge → Web3 (single continuous amber path) -->
    <g id="probe-oc" filter="url(#oc-glow-dl)">
      <line x1="468" y1="167" x2="468" y2="290" stroke="#F59E0B" stroke-width="2.5" opacity="0.95"/>
      <!-- Arc bridge from Data level → Web3 platform (kept curved, per §16) -->
      <path d="M 468 278 Q 545 270 625 280" stroke="#F59E0B" stroke-width="2.5" fill="none" opacity="0.95"/>
      <circle cx="468" cy="245" r="5" fill="#F4F5F7" stroke="#F59E0B" stroke-width="2.5"/>
      <circle cx="468" cy="335" r="5" fill="#F4F5F7" stroke="#F59E0B" stroke-width="2.5"/>
      <!-- Junction dot where the bridge departs the main probe -->
      <circle cx="468" cy="278" r="4.5" fill="#F59E0B"/>
      <!-- Web3 terminus -->
      <circle cx="628" cy="280" r="5" fill="#F4F5F7" stroke="#F59E0B" stroke-width="2.5"/>
    </g>
    <!-- Bridge label -->
    <text x="500" y="262" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="13" fill="#B45309" font-weight="bold">bridge</text>
    <!-- OC badge — entry node on the Backend top edge -->
    <circle cx="468" cy="167" r="3.5" fill="#F59E0B"/>
    <line x1="468" y1="155" x2="468" y2="167" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
    <rect x="449" y="133" width="38" height="22" rx="3" fill="#F59E0B"/>
    <text x="455" y="149" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="13" fill="#241A02" font-weight="bold">OC</text>

  </g>

  <!-- ── LAYER LABELS ── -->
  <g id="labels" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace">
    <rect x="244" y="102" width="200" height="27" fill="#E4E9F1" clip-path="url(#clip-fe-dl)"/>
    <text x="255" y="121" font-size="17" fill="#2B3542" letter-spacing="1.5" font-weight="bold">FRONTEND</text>
    <text x="386" y="121" font-size="11" fill="#707988">· CORE</text>
    <rect x="244" y="192" width="200" height="27" fill="#E6EBF2" clip-path="url(#clip-be-dl)"/>
    <text x="255" y="211" font-size="17" fill="#2B3542" letter-spacing="1.5" font-weight="bold">BACKEND</text>
    <text x="386" y="211" font-size="11" fill="#707988">· CORE</text>
    <rect x="244" y="282" width="176" height="27" fill="#EDF0F5" clip-path="url(#clip-da-dl)"/>
    <text x="255" y="301" font-size="17" fill="#4A5563" letter-spacing="1.5" font-weight="bold">DATA</text>
    <text x="320" y="301" font-size="11" fill="#707988">· WORKING WITH</text>
    <rect x="231" y="373" width="118" height="42" fill="#F2F4F7" clip-path="url(#clip-ai-dl)"/>
    <text x="240" y="390" font-size="17" fill="#5C6674" letter-spacing="1.5" font-weight="bold">AI / ML</text>
    <text x="240" y="407" font-size="11" fill="#707988">· EXPLORING</text>
  </g>

  <!-- ── PROJECT INDEX ── -->
  <g transform="translate(48, 470)" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace">
    <line x1="0" y1="0" x2="704" y2="0" stroke="#D5DAE1" stroke-width="1"/>
    <g transform="translate(0,20)">
      <rect x="0" y="-11" width="30" height="16" rx="2" fill="#F59E0B"/>
      <text x="5" y="1.5" font-size="11" fill="#241A02" font-weight="bold">CC</text>
      <text x="42" y="1.5" font-size="11" fill="#4A5563">campus-connect</text>
      <text x="196" y="1.5" font-size="10" fill="#707988">Flask · PostgreSQL · Tailwind/Jinja2</text>
    </g>
    <g transform="translate(0,42)">
      <rect x="0" y="-11" width="38" height="16" rx="2" fill="#F59E0B"/>
      <text x="5" y="1.5" font-size="11" fill="#241A02" font-weight="bold">WSA</text>
      <text x="50" y="1.5" font-size="11" fill="#4A5563">womens-safety-alert-system</text>
      <text x="290" y="1.5" font-size="10" fill="#707988">Java · MySQL · CLI</text>
    </g>
    <g transform="translate(0,64)">
      <rect x="0" y="-11" width="38" height="16" rx="2" fill="#F59E0B"/>
      <text x="5" y="1.5" font-size="11" fill="#241A02" font-weight="bold">AMR</text>
      <text x="50" y="1.5" font-size="11" fill="#4A5563">AMR-Insight</text>
      <text x="160" y="1.5" font-size="10" fill="#707988">Node/Express · Django-ML · SHAP</text>
    </g>
    <g transform="translate(0,86)">
      <rect x="0" y="-11" width="30" height="16" rx="2" fill="#F59E0B"/>
      <text x="5" y="1.5" font-size="11" fill="#241A02" font-weight="bold">OC</text>
      <text x="42" y="1.5" font-size="11" fill="#4A5563">originchain</text>
      <text x="160" y="1.5" font-size="10" fill="#707988">Express · Prisma · Arbitrum Stylus</text>
    </g>
  </g>

</svg>
