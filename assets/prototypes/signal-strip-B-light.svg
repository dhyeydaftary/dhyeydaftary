<svg viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ss-Bl-t ss-Bl-d">
  <title id="ss-Bl-t">Signal Strip — abstract technical banner (variant B, light)</title>
  <desc id="ss-Bl-d">A wide, low, abstract banner in a graphite palette: thin isometric linework in shallow perspective that grows more defined toward the centre and tapers into negative space at both edges, with three small amber signal markers. Visual identity and texture only — it carries no data, labels, or diagram content.</desc>

  <defs>
    <linearGradient id="ss-Bl-glow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0" stop-color="#9AA3B0" stop-opacity="0.03"/>
      <stop offset="0.17" stop-color="#9AA3B0" stop-opacity="0.28"/>
      <stop offset="0.47" stop-color="#9AA3B0" stop-opacity="0.84"/>
      <stop offset="0.72" stop-color="#9AA3B0" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#9AA3B0" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="ss-Bl-fadeL" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="285" y2="0">
      <stop offset="0" stop-color="#F4F5F7" stop-opacity="1"/>
      <stop offset="1" stop-color="#F4F5F7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ss-Bl-fadeR" gradientUnits="userSpaceOnUse" x1="875" y1="0" x2="1200" y2="0">
      <stop offset="0" stop-color="#F4F5F7" stop-opacity="0"/>
      <stop offset="1" stop-color="#F4F5F7" stop-opacity="1"/>
    </linearGradient>
  </defs>

