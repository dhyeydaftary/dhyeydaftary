<svg viewBox="0 0 800 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-title-b svg-desc-b" style="font-family: 'JetBrains Mono','SFMono-Regular','Consolas',monospace;">

  <title id="svg-title-b">Stack Cross-Section — Engineering Map (Schematic)</title>
  <desc id="svg-desc-b">Flat engineering schematic showing four architectural layers and a Web3 branch. Amber project probes trace actual project coverage: CC spans Frontend–Backend–Data; WSA spans Backend–Data; AMR spans Backend–Data–AI/ML; OC is a continuous path from Backend through Data to Web3.</desc>

  <defs>
    <filter id="amber-glow-b" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Grid pattern for schematic feel -->
    <pattern id="grid-b" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1F2937" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background with subtle grid -->
  <rect width="800" height="580" fill="#0D1117"/>
  <rect width="800" height="580" fill="url(#grid-b)" opacity="0.6"/>

  <!-- ─── TITLE ─── -->
  <g id="header">
    <text x="48" y="42" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="13" fill="#3D444D" letter-spacing="2">ENGINEERING MAP · VARIANT B</text>
    <text x="48" y="70" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="22" fill="#E6EDF3" font-weight="bold" letter-spacing="0.5">stack cross-section</text>
    <rect x="48" y="77" width="60" height="2" rx="1" fill="#F59E0B"/>
    <!-- Schematic annotation -->
    <text x="48" y="94" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="10.5" fill="#3D444D" letter-spacing="1">— flat schematic —</text>
  </g>

  <!-- ─── LEGEND ─── -->
  <g id="legend" transform="translate(560, 30)">
    <rect x="0" y="0" width="15" height="15" rx="1" fill="#21262D" stroke="#58A6FF" stroke-width="1.5"/>
    <text x="22" y="12" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="11" fill="#8B949E">CORE</text>
    <rect x="0" y="24" width="15" height="15" rx="1" fill="#161B22" stroke="#484F58" stroke-width="1.5"/>
    <text x="22" y="36" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="11" fill="#8B949E">WORKING WITH</text>
    <rect x="0" y="48" width="15" height="15" rx="1" fill="none" stroke="#484F58" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="22" y="60" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="11" fill="#8B949E">EXPLORING</text>
    <line x1="0" y1="82" x2="15" y2="82" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="7.5" cy="82" r="3.5" fill="#0D1117" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="22" y="86" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="11" fill="#8B949E">PROBE</text>
  </g>

  <!-- ─────────────────────────────────────────────
       FLAT SCHEMATIC LAYERS
       Flat horizontal bands — engineering diagram style.
       Each layer is a labeled rectangular band with a left status bar.

       Layout:
         Left margin: 80px   Layer width: 500px   Height: 68px   Gap: 10px
         Frontend  : y=115    Backend : y=193    Data : y=271    AI/ML : y=349

       Per-layer technology lists intentionally omitted from the map
       (they collide with the vertical probes in a flat layout, and are
       fully carried by the Project Index below). Same choice across A/B/C.
       ───────────────────────────────────────────── -->

  <!-- Left connector rail -->
  <line x1="80" y1="115" x2="80" y2="430" stroke="#30363D" stroke-width="1.5"/>
  <g stroke="#30363D" stroke-width="1">
    <line x1="74" y1="149" x2="86" y2="149"/>
    <line x1="74" y1="227" x2="86" y2="227"/>
    <line x1="74" y1="305" x2="86" y2="305"/>
    <line x1="74" y1="383" x2="86" y2="383"/>
  </g>
  <text transform="translate(60,368) rotate(-90)" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="9" fill="#3D444D" letter-spacing="2">DEPTH</text>

  <!-- ══ FRONTEND (CORE) ══ -->
  <g id="layer-frontend">
    <rect x="86" y="115" width="5" height="68" fill="#4B5563"/>
    <rect x="91" y="115" width="500" height="68" fill="#161B22" stroke="#30363D" stroke-width="1.5" rx="1"/>
    <line x1="591" y1="115" x2="602" y2="115" stroke="#30363D" stroke-width="1"/>
    <line x1="591" y1="183" x2="602" y2="183" stroke="#30363D" stroke-width="1"/>
    <line x1="597" y1="115" x2="597" y2="183" stroke="#30363D" stroke-width="0.5"/>
    <line x1="91" y1="115" x2="91" y2="125" stroke="#58A6FF" stroke-width="1" opacity="0.4"/>
    <line x1="91" y1="125" x2="101" y2="125" stroke="#58A6FF" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- ══ BACKEND (CORE) ══ -->
  <g id="layer-backend">
    <rect x="86" y="193" width="5" height="68" fill="#4B5563"/>
    <rect x="91" y="193" width="500" height="68" fill="#161B22" stroke="#30363D" stroke-width="1.5" rx="1"/>
    <line x1="591" y1="193" x2="602" y2="193" stroke="#30363D" stroke-width="1"/>
    <line x1="591" y1="261" x2="602" y2="261" stroke="#30363D" stroke-width="1"/>
    <line x1="597" y1="193" x2="597" y2="261" stroke="#30363D" stroke-width="0.5"/>
    <line x1="91" y1="193" x2="91" y2="203" stroke="#58A6FF" stroke-width="1" opacity="0.4"/>
    <line x1="91" y1="203" x2="101" y2="203" stroke="#58A6FF" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- ══ DATA (WORKING WITH) ══ -->
  <g id="layer-data">
    <rect x="86" y="271" width="5" height="68" fill="#374151"/>
    <rect x="91" y="271" width="500" height="68" fill="#0D1117" stroke="#30363D" stroke-width="1.5" rx="1"/>
    <line x1="591" y1="271" x2="602" y2="271" stroke="#30363D" stroke-width="1"/>
    <line x1="591" y1="339" x2="602" y2="339" stroke="#30363D" stroke-width="1"/>
    <line x1="597" y1="271" x2="597" y2="339" stroke="#30363D" stroke-width="0.5"/>
  </g>

  <!-- ══ AI/ML (EXPLORING) ══ -->
  <g id="layer-aiml">
    <rect x="86" y="349" width="5" height="68" fill="none" stroke="#374151" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="91" y="349" width="500" height="68" fill="none" stroke="#30363D" stroke-width="1.5" stroke-dasharray="5,3" rx="1"/>
    <line x1="591" y1="349" x2="602" y2="349" stroke="#30363D" stroke-width="1" opacity="0.5"/>
    <line x1="591" y1="417" x2="602" y2="417" stroke="#30363D" stroke-width="1" opacity="0.5"/>
    <line x1="597" y1="349" x2="597" y2="417" stroke="#30363D" stroke-width="0.5" opacity="0.5"/>
  </g>

  <!-- ─────────────────────────────────────────────
       WEB3 BRANCH — flat schematic, right side
       ───────────────────────────────────────────── -->
  <g id="web3-branch">
    <rect x="635" y="250" width="130" height="80" fill="none" stroke="#30363D" stroke-width="1.5" stroke-dasharray="5,3" rx="1"/>
    <line x1="635" y1="250" x2="635" y2="260" stroke="#F59E0B" stroke-width="0.5" opacity="0.3"/>
    <line x1="635" y1="260" x2="645" y2="260" stroke="#F59E0B" stroke-width="0.5" opacity="0.3"/>
    <text x="650" y="279" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="15" fill="#6E7681" letter-spacing="2" font-weight="bold">WEB3</text>
    <text x="650" y="296" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="9.5" fill="#484F58">─── EXPLORING</text>
    <text x="650" y="315" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="10" fill="#484F58">Solidity · Arbitrum</text>
  </g>

  <!-- ─────────────────────────────────────────────
       PROJECT PROBES (flat — vertical lines with nodes)

       Layer center y positions:
         Frontend : 149   Backend : 227   Data : 305   AI/ML : 383
       Probe x positions:
         CC : x=160   WSA : x=240   AMR : x=320   OC : x=400

       Bug-2 fix: every probe's code tag straddles the TOP EDGE of the
       probe's real entry band — CC at the Frontend edge (y=115),
       WSA/AMR/OC at the Backend edge (y=193). No tag sits over the
       Frontend body or any layer-name text. One consistent rule.
       ───────────────────────────────────────────── -->

  <g id="projects" filter="url(#amber-glow-b)">

    <!-- CC: Frontend → Backend → Data -->
    <g id="probe-cc">
      <line x1="160" y1="115" x2="160" y2="339" stroke="#F59E0B" stroke-width="2.5" opacity="0.9"/>
      <circle cx="160" cy="149" r="4.5" fill="#0D1117" stroke="#F59E0B" stroke-width="2"/>
      <circle cx="160" cy="227" r="4.5" fill="#0D1117" stroke="#F59E0B" stroke-width="2"/>
      <circle cx="160" cy="305" r="4.5" fill="#0D1117" stroke="#F59E0B" stroke-width="2"/>
      <rect x="152" y="336" width="16" height="3" rx="1" fill="#F59E0B" opacity="0.5"/>
      <!-- Code tag — straddles Frontend top edge (real entry) -->
      <rect x="143" y="100" width="30" height="18" rx="2" fill="#F59E0B"/>
      <text x="148" y="113" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="11" fill="#0D1117" font-weight="bold">CC</text>
    </g>

    <!-- WSA: Backend → Data -->
    <g id="probe-wsa">
      <line x1="240" y1="193" x2="240" y2="339" stroke="#F59E0B" stroke-width="2.5" opacity="0.9"/>
      <circle cx="240" cy="227" r="4.5" fill="#0D1117" stroke="#F59E0B" stroke-width="2"/>
      <circle cx="240" cy="305" r="4.5" fill="#0D1117" stroke="#F59E0B" stroke-width="2"/>
      <rect x="232" y="336" width="16" height="3" rx="1" fill="#F59E0B" opacity="0.5"/>
      <!-- Code tag — straddles Backend top edge (real entry) -->
      <rect x="219" y="184" width="42" height="18" rx="2" fill="#F59E0B"/>
      <text x="224" y="197" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="11" fill="#0D1117" font-weight="bold">WSA</text>
    </g>

    <!-- AMR: Backend → Data → AI/ML -->
    <g id="probe-amr">
      <line x1="320" y1="193" x2="320" y2="417" stroke="#F59E0B" stroke-width="2.5" opacity="0.9"/>
      <circle cx="320" cy="227" r="4.5" fill="#0D1117" stroke="#F59E0B" stroke-width="2"/>
      <circle cx="320" cy="305" r="4.5" fill="#0D1117" stroke="#F59E0B" stroke-width="2"/>
      <circle cx="320" cy="383" r="4.5" fill="#0D1117" stroke="#F59E0B" stroke-width="2"/>
      <rect x="312" y="414" width="16" height="3" rx="1" fill="#F59E0B" opacity="0.5"/>
      <!-- Code tag — straddles Backend top edge (real entry) -->
      <rect x="299" y="184" width="42" height="18" rx="2" fill="#F59E0B"/>
      <text x="304" y="197" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="11" fill="#0D1117" font-weight="bold">AMR</text>
    </g>

    <!-- OC: Backend → Data → bridge → Web3 -->
    <g id="probe-oc">
      <line x1="400" y1="193" x2="400" y2="305" stroke="#F59E0B" stroke-width="2.5" opacity="0.9"/>
      <line x1="400" y1="290" x2="635" y2="290" stroke="#F59E0B" stroke-width="2.5" opacity="0.9"/>
      <circle cx="400" cy="227" r="4.5" fill="#0D1117" stroke="#F59E0B" stroke-width="2"/>
      <circle cx="400" cy="305" r="4.5" fill="#0D1117" stroke="#F59E0B" stroke-width="2"/>
      <circle cx="400" cy="290" r="3" fill="#F59E0B"/>
      <circle cx="635" cy="290" r="4.5" fill="#0D1117" stroke="#F59E0B" stroke-width="2"/>
      <!-- Bridge label -->
      <text x="470" y="283" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="11" fill="#D97706">bridge</text>
      <!-- Code tag — straddles Backend top edge (real entry) -->
      <rect x="381" y="184" width="34" height="18" rx="2" fill="#F59E0B"/>
      <text x="386" y="197" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="11" fill="#0D1117" font-weight="bold">OC</text>
    </g>

  </g>

  <!-- ── LAYER LABELS ──
       Drawn AFTER the probes with a band-colour text halo (paint-order:
       stroke) so the CC probe line passing behind the glyphs is knocked
       out rather than cutting through the text. Positions unchanged. -->
  <g id="labels" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace">
    <rect x="103" y="132" width="108" height="40" fill="#161B22"/>
    <text x="108" y="148" font-size="16" fill="#C9D1D9" letter-spacing="2" font-weight="bold">FRONTEND</text>
    <text x="108" y="166" font-size="10.5" fill="#6E7681">─── CORE</text>
    <rect x="103" y="210" width="108" height="40" fill="#161B22"/>
    <text x="108" y="226" font-size="16" fill="#C9D1D9" letter-spacing="2" font-weight="bold">BACKEND</text>
    <text x="108" y="244" font-size="10.5" fill="#6E7681">─── CORE</text>
    <rect x="103" y="288" width="172" height="40" fill="#0D1117"/>
    <text x="108" y="304" font-size="16" fill="#9CA3AF" letter-spacing="2" font-weight="bold">DATA</text>
    <text x="108" y="322" font-size="10.5" fill="#565E68">─── WORKING WITH</text>
    <text x="108" y="382" font-size="16" fill="#6E7681" letter-spacing="2" font-weight="bold">AI / ML</text>
    <text x="108" y="400" font-size="10.5" fill="#484F58">─── EXPLORING</text>
  </g>

  <!-- ─────────────────────────────────────────────
       SCHEMATIC ANNOTATIONS (right margin)
       ───────────────────────────────────────────── -->
  <g id="right-annotations" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="9" fill="#30363D">
    <text x="610" y="153">H:68</text>
    <text x="610" y="231">H:68</text>
    <text x="610" y="309">H:68</text>
    <text x="610" y="387">H:68</text>
  </g>

  <!-- ─────────────────────────────────────────────
       PROJECT INDEX
       ───────────────────────────────────────────── -->
  <g id="project-index" transform="translate(80, 450)">
    <line x1="0" y1="0" x2="680" y2="0" stroke="#21262D" stroke-width="1"/>
    <g transform="translate(0, 20)">
      <rect x="0" y="-11" width="30" height="16" rx="2" fill="#F59E0B"/>
      <text x="5" y="1.5" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="11" fill="#0D1117" font-weight="bold">CC</text>
      <text x="42" y="1.5" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="11" fill="#8B949E">campus-connect</text>
      <text x="196" y="1.5" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="10" fill="#565E68">Flask · PostgreSQL · Tailwind/Jinja2</text>
    </g>
    <g transform="translate(0, 42)">
      <rect x="0" y="-11" width="38" height="16" rx="2" fill="#F59E0B"/>
      <text x="5" y="1.5" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="11" fill="#0D1117" font-weight="bold">WSA</text>
      <text x="50" y="1.5" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="11" fill="#8B949E">womens-safety-alert-system</text>
      <text x="290" y="1.5" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="10" fill="#565E68">Java · MySQL · CLI</text>
    </g>
    <g transform="translate(0, 64)">
      <rect x="0" y="-11" width="38" height="16" rx="2" fill="#F59E0B"/>
      <text x="5" y="1.5" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="11" fill="#0D1117" font-weight="bold">AMR</text>
      <text x="50" y="1.5" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="11" fill="#8B949E">AMR-Insight</text>
      <text x="160" y="1.5" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="10" fill="#565E68">Node/Express · Django-ML · SHAP</text>
    </g>
    <g transform="translate(0, 86)">
      <rect x="0" y="-11" width="30" height="16" rx="2" fill="#F59E0B"/>
      <text x="5" y="1.5" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="11" fill="#0D1117" font-weight="bold">OC</text>
      <text x="42" y="1.5" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="11" fill="#8B949E">originchain</text>
      <text x="160" y="1.5" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="10" fill="#565E68">Express · Prisma · Arbitrum Stylus</text>
    </g>
  </g>

  <text x="752" y="570" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="9" fill="#30363D" text-anchor="end">variant-B / dark</text>

</svg>
