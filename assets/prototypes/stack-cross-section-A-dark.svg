<svg viewBox="0 0 800 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-title-a svg-desc-a">

  <title id="svg-title-a">Stack Cross-Section — Engineering Map (Variant A)</title>
  <desc id="svg-desc-a">Isometric cross-section of a software system showing four architectural layers (Frontend, Backend, Data, AI/ML) and a Web3 branch. Amber project probes trace actual coverage: CC spans Frontend–Backend–Data; WSA spans Backend–Data; AMR spans Backend–Data–AI/ML; OC is a continuous path from Backend through Data to Web3.</desc>

  <defs>
    <filter id="amber-glow-a" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="layer-shadow-a" x="-5%" y="-5%" width="115%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <!-- Top-face clips so label knockout panels can't spill past a slab edge -->
    <clipPath id="clip-fe-a"><polygon points="110,145 490,65 570,105 190,185"/></clipPath>
    <clipPath id="clip-be-a"><polygon points="110,223 490,143 570,183 190,263"/></clipPath>
    <clipPath id="clip-da-a"><polygon points="110,301 490,221 570,261 190,341"/></clipPath>
    <clipPath id="clip-ai-a"><polygon points="110,379 490,299 570,339 190,419"/></clipPath>
  </defs>

  <rect width="800" height="580" fill="#111318"/>

  <!-- ── HEADER ── -->
  <text x="48" y="40" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="13" fill="#4B5563" letter-spacing="2">ENGINEERING MAP · VARIANT A</text>
  <text x="48" y="66" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="21" fill="#F3F4F6" font-weight="bold" letter-spacing="0.5">stack cross-section</text>
  <rect x="48" y="73" width="60" height="2" rx="1" fill="#F59E0B"/>

  <!-- ── LEGEND ── -->
  <g transform="translate(560, 26)" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace">
    <rect x="0" y="0" width="14" height="14" rx="2" fill="#2A3347" stroke="#4B5563" stroke-width="1.5"/>
    <text x="21" y="11.5" font-size="11" fill="#9CA3AF">CORE</text>
    <rect x="0" y="22" width="14" height="14" rx="2" fill="#1C2333" stroke="#4B5563" stroke-width="1.5"/>
    <text x="21" y="33.5" font-size="11" fill="#9CA3AF">WORKING WITH</text>
    <rect x="0" y="44" width="14" height="14" rx="2" fill="none" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="21" y="55.5" font-size="11" fill="#9CA3AF">EXPLORING</text>
    <line x1="0" y1="75" x2="14" y2="75" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="7" cy="75" r="4" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="21" y="78.5" font-size="11" fill="#9CA3AF">PROJECT PROBE</text>
  </g>

  <!-- ──────────────────────────────────────────────
       ISOMETRIC LAYERS
       Each layer: parallelogram top-face + right side-face.

       Layer baselines (top-face left vertex y):
         Frontend : 145
         Backend  : 223
         Data     : 301
         AI/ML    : 379

       Top-face left vertex: (110, y)
       Top-face right vertex: (490, y-80)   [480px wide → ~80px iso rise]
       Side right-face: adds depth strip of 20px below right edge
  ────────────────────────────────────────────── -->

  <!-- FRONTEND — CORE (solid) -->
  <g id="layer-frontend" filter="url(#layer-shadow-a)">
    <polygon points="490,65 570,105 570,125 490,85" fill="#1E2433" stroke="#374151" stroke-width="1"/>
    <polygon points="110,145 490,65 570,105 190,185" fill="#2A3347" stroke="#4B5563" stroke-width="1.5"/>
  </g>

  <!-- BACKEND — CORE (solid) -->
  <g id="layer-backend" filter="url(#layer-shadow-a)">
    <polygon points="490,143 570,183 570,203 490,163" fill="#1A2030" stroke="#374151" stroke-width="1"/>
    <polygon points="110,223 490,143 570,183 190,263" fill="#232D3F" stroke="#4B5563" stroke-width="1.5"/>
  </g>

  <!-- DATA — WORKING WITH (lighter neutral, solid border) -->
  <g id="layer-data" filter="url(#layer-shadow-a)">
    <polygon points="490,221 570,261 570,281 490,241" fill="#161C26" stroke="#374151" stroke-width="1"/>
    <polygon points="110,301 490,221 570,261 190,341" fill="#1C2333" stroke="#4B5563" stroke-width="1.5"/>
  </g>

  <!-- AI/ML — EXPLORING (dashed outline) -->
  <g id="layer-aiml" filter="url(#layer-shadow-a)">
    <polygon points="490,299 570,339 570,359 490,319" fill="#111318" stroke="#374151" stroke-width="1" stroke-dasharray="4,3"/>
    <polygon points="110,379 490,299 570,339 190,419" fill="#161B25" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5,3"/>
  </g>

  <!-- ── WEB3 BRANCH (EXPLORING) ── -->
  <g id="web3-branch">
    <polygon points="590,258 680,228 728,252 638,282" fill="#111318" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5,3"/>
    <polygon points="680,228 728,252 728,266 680,242" fill="#0F1318" stroke="#374151" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="612" y="256" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="13" fill="#8B93A0" letter-spacing="1" font-weight="bold">WEB3</text>
    <text x="612" y="270" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="9.5" fill="#6B7280">EXPLORING</text>
    <text x="592" y="294" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="10" fill="#6B7280">Solidity · Arbitrum</text>
  </g>

  <!-- ── LEFT EDGE DEPTH MARKER ── -->
  <line x1="108" y1="145" x2="108" y2="419" stroke="#374151" stroke-width="1" opacity="0.5"/>
  <g stroke="#374151" stroke-width="1" opacity="0.5">
    <line x1="104" y1="145" x2="112" y2="145"/>
    <line x1="104" y1="223" x2="112" y2="223"/>
    <line x1="104" y1="301" x2="112" y2="301"/>
    <line x1="104" y1="379" x2="112" y2="379"/>
    <line x1="104" y1="419" x2="112" y2="419"/>
  </g>
  <text transform="translate(88,392) rotate(-90)" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="9" fill="#4B5563" letter-spacing="1.5">DEPTH</text>

  <!-- ──────────────────────────────────────────────
       PROJECT PROBES — AMBER

       Probe x positions (staggered):
         CC  : x=178
         WSA : x=275
         AMR : x=370
         OC  : x=455

       Layer top-face y at each probe x (using iso rise formula:
         y_at_x = top_y - 80*(x-110)/380 ):

         Frontend top_y=145:
           CC  at x=178: 145 - 14.3 = 131

         Backend top_y=223:
           CC  at x=178: 223 - 14.3 = 209
           WSA at x=275: 223 - 34.7 = 188
           AMR at x=370: 223 - 54.7 = 168
           OC  at x=455: 223 - 72.6 = 150

         Data top_y=301:
           CC  at x=178: 301 - 14.3 = 287
           WSA at x=275: 301 - 34.7 = 266
           AMR at x=370: 301 - 54.7 = 246
           OC  at x=455: 301 - 72.6 = 228

         AI/ML top_y=379:
           AMR at x=370: 379 - 54.7 = 324

       Non-Frontend probe badges sit in the Frontend-underside /
       Backend-top gap at each probe's own x, forming a descending
       staircase — never over any layer-name text.
  ────────────────────────────────────────────── -->

  <g id="projects" filter="url(#amber-glow-a)">

    <!-- CC: Frontend → Backend → Data -->
    <g id="probe-cc">
      <line x1="178" y1="131" x2="178" y2="308" stroke="#F59E0B" stroke-width="2" opacity="0.9"/>
      <circle cx="178" cy="145" r="4" fill="#111318" stroke="#F59E0B" stroke-width="2"/>
      <circle cx="178" cy="223" r="4" fill="#111318" stroke="#F59E0B" stroke-width="2"/>
      <circle cx="178" cy="301" r="4" fill="#111318" stroke="#F59E0B" stroke-width="2"/>
      <!-- Badge above Frontend (CC genuinely enters at Frontend) -->
      <line x1="178" y1="90" x2="178" y2="131" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>
      <rect x="160" y="70" width="36" height="20" rx="3" fill="#F59E0B"/>
      <text x="166" y="85" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="12" fill="#111318" font-weight="bold">CC</text>
    </g>

    <!-- WSA: Backend → Data -->
    <g id="probe-wsa">
      <line x1="275" y1="188" x2="275" y2="287" stroke="#F59E0B" stroke-width="2" opacity="0.9"/>
      <circle cx="275" cy="223" r="4" fill="#111318" stroke="#F59E0B" stroke-width="2"/>
      <circle cx="275" cy="301" r="4" fill="#111318" stroke="#F59E0B" stroke-width="2"/>
      <!-- Badge in the gap just above WSA's Backend entry -->
      <line x1="275" y1="172" x2="275" y2="188" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>
      <rect x="244" y="152" width="44" height="20" rx="3" fill="#F59E0B"/>
      <text x="250" y="167" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="12" fill="#111318" font-weight="bold">WSA</text>
    </g>

    <!-- AMR: Backend → Data → AI/ML -->
    <g id="probe-amr">
      <line x1="370" y1="168" x2="370" y2="346" stroke="#F59E0B" stroke-width="2" opacity="0.9"/>
      <circle cx="370" cy="223" r="4" fill="#111318" stroke="#F59E0B" stroke-width="2"/>
      <circle cx="370" cy="301" r="4" fill="#111318" stroke="#F59E0B" stroke-width="2"/>
      <circle cx="370" cy="379" r="4" fill="#111318" stroke="#F59E0B" stroke-width="2"/>
      <!-- Badge in the gap just above AMR's Backend entry -->
      <line x1="370" y1="154" x2="370" y2="168" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>
      <rect x="348" y="134" width="44" height="20" rx="3" fill="#F59E0B"/>
      <text x="354" y="149" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="12" fill="#111318" font-weight="bold">AMR</text>
    </g>

    <!-- OC: Backend → Data → bridge → Web3 (continuous amber path) -->
    <g id="probe-oc">
      <line x1="455" y1="150" x2="455" y2="248" stroke="#F59E0B" stroke-width="2" opacity="0.9"/>
      <!-- Bridge: exit at Data level, curve to Web3 -->
      <path d="M 455 240 Q 528 238 594 252" stroke="#F59E0B" stroke-width="2" fill="none" opacity="0.9"/>
      <circle cx="455" cy="223" r="4" fill="#111318" stroke="#F59E0B" stroke-width="2"/>
      <circle cx="455" cy="301" r="4" fill="#111318" stroke="#F59E0B" stroke-width="2"/>
      <!-- Junction dot where bridge splits from main probe -->
      <circle cx="455" cy="240" r="3" fill="#F59E0B"/>
      <!-- Web3 terminus -->
      <circle cx="596" cy="252" r="4" fill="#111318" stroke="#F59E0B" stroke-width="2"/>
      <!-- Bridge label -->
      <text x="486" y="232" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="11" fill="#D97706">bridge</text>
      <!-- Badge in the gap just above OC's Backend entry -->
      <line x1="455" y1="136" x2="455" y2="150" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>
      <rect x="437" y="116" width="36" height="20" rx="3" fill="#F59E0B"/>
      <text x="443" y="131" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="12" fill="#111318" font-weight="bold">OC</text>
    </g>

  </g>

  <!-- ── LAYER LABELS ──
       Drawn AFTER the probes with a face-colour text halo (paint-order:
       stroke) so a probe line passing behind the glyphs is knocked out
       rather than cutting through the text. Positions unchanged. -->
  <g id="labels" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace">
    <rect x="244" y="93" width="200" height="27" fill="#2A3347" clip-path="url(#clip-fe-a)"/>
    <text x="255" y="112" font-size="17" fill="#C9D1D9" letter-spacing="1.5" font-weight="bold">FRONTEND</text>
    <text x="384" y="112" font-size="11" fill="#6B7280">· CORE</text>
    <rect x="244" y="171" width="200" height="27" fill="#232D3F" clip-path="url(#clip-be-a)"/>
    <text x="255" y="190" font-size="17" fill="#C9D1D9" letter-spacing="1.5" font-weight="bold">BACKEND</text>
    <text x="392" y="190" font-size="11" fill="#6B7280">· CORE</text>
    <rect x="244" y="249" width="176" height="27" fill="#1C2333" clip-path="url(#clip-da-a)"/>
    <text x="255" y="268" font-size="17" fill="#9CA3AF" letter-spacing="1.5" font-weight="bold">DATA</text>
    <text x="320" y="268" font-size="11" fill="#6B7280">· WORKING WITH</text>
    <rect x="231" y="328" width="118" height="44" fill="#161B25" clip-path="url(#clip-ai-a)"/>
    <text x="240" y="345" font-size="17" fill="#8B93A0" letter-spacing="1.5" font-weight="bold">AI / ML</text>
    <text x="240" y="362" font-size="11" fill="#565E68">· EXPLORING</text>
  </g>

  <!-- ── PROJECT INDEX ── -->
  <g transform="translate(48, 452)" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace">
    <line x1="0" y1="0" x2="704" y2="0" stroke="#1F2937" stroke-width="1"/>
    <g transform="translate(0,20)">
      <rect x="0" y="-11" width="30" height="16" rx="2" fill="#F59E0B"/>
      <text x="5" y="1.5" font-size="11" fill="#111318" font-weight="bold">CC</text>
      <text x="42" y="1.5" font-size="11" fill="#9CA3AF">campus-connect</text>
      <text x="196" y="1.5" font-size="10" fill="#6B7280">Flask · PostgreSQL · Tailwind/Jinja2</text>
    </g>
    <g transform="translate(0,42)">
      <rect x="0" y="-11" width="38" height="16" rx="2" fill="#F59E0B"/>
      <text x="5" y="1.5" font-size="11" fill="#111318" font-weight="bold">WSA</text>
      <text x="50" y="1.5" font-size="11" fill="#9CA3AF">womens-safety-alert-system</text>
      <text x="290" y="1.5" font-size="10" fill="#6B7280">Java · MySQL · CLI</text>
    </g>
    <g transform="translate(0,64)">
      <rect x="0" y="-11" width="38" height="16" rx="2" fill="#F59E0B"/>
      <text x="5" y="1.5" font-size="11" fill="#111318" font-weight="bold">AMR</text>
      <text x="50" y="1.5" font-size="11" fill="#9CA3AF">AMR-Insight</text>
      <text x="160" y="1.5" font-size="10" fill="#6B7280">Node/Express · Django-ML · SHAP</text>
    </g>
    <g transform="translate(0,86)">
      <rect x="0" y="-11" width="30" height="16" rx="2" fill="#F59E0B"/>
      <text x="5" y="1.5" font-size="11" fill="#111318" font-weight="bold">OC</text>
      <text x="42" y="1.5" font-size="11" fill="#9CA3AF">originchain</text>
      <text x="160" y="1.5" font-size="10" fill="#6B7280">Express · Prisma · Arbitrum Stylus</text>
    </g>
  </g>

  <text x="752" y="572" font-family="'JetBrains Mono','SFMono-Regular','Consolas',monospace" font-size="9" fill="#374151" text-anchor="end">variant-A / dark</text>

</svg>
