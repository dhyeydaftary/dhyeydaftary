name: Contribution activity

# Regenerates the isometric contribution-calendar SVGs embedded by the profile
# README. lowlighter/metrics, self-hosted, Isocalendar plugin (isometric 3D
# contribution landscape).
#
# NOTE (scope change, v2): the README now has two 3D moments — the signature
# engineering map AND this calendar. This is an intentional, approved override
# of the earlier "one isometric place only" rule, not an oversight.
#
# Requires repo secret METRICS_TOKEN — a GitHub PAT; a scopeless / read-only
# token is sufficient (public profile + contribution data only). The token
# itself needs no repo-write scope; the job's `contents: write` permission
# handles the commit.
# Commits its own output to `dev` (never `main`, per §31).

on:
  schedule:
    - cron: "17 5 * * *"      # daily, 05:17 UTC — daily is sufficient (§26)
  workflow_dispatch: {}        # manual trigger for the first run / testing

permissions:
  contents: write              # the Action commits the generated SVGs to dev

jobs:
  isocalendar:
    runs-on: ubuntu-latest
    steps:
      # ── dark  ->  assets/contribution-calendar-dark.svg ──────────────────
      - name: Isocalendar (dark)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: dhyeydaftary
          filename: assets/contribution-calendar-dark.svg
          base: ""                              # no default sections — plugin only
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year   # 1 year; use half-year for a smaller block
          config_timezone: Asia/Kolkata
          output_action: commit
          committer_branch: dev                 # <-- targets dev, not main (§31)
          committer_message: "chore(assets): refresh isometric contribution calendar (dark)"
          # Ground only: graphite background + a theme-matched label colour.
          # The contribution-intensity scale is deliberately left as the
          # isocalendar plugin's native GitHub green ramp — an intentional,
          # confirmed break from the single-accent-colour rule used elsewhere
          # in the README. (Isocalendar exposes no colour config anyway;
          # extras_css can style the ground + text but not the 3D cube faces.)
          extras_css: |
            svg { background: #0c0f14 !important; }
            text, tspan { fill: #8b93a0 !important; }
            /* Empty (zero-contribution) day tiles: one subtle step off the
               ground so the whole grid floor stays visible. Contribution
               levels L1-L4 keep the plugin's native green. */
            :root { --color-calendar-graph-day-bg: #1a1f28; }
            [fill="#ebedf0"], [fill="#161b22"] { fill: #1a1f28 !important; }

      # ── light  ->  assets/contribution-calendar-light.svg ────────────────
      - name: Isocalendar (light)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: dhyeydaftary
          filename: assets/contribution-calendar-light.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Kolkata
          output_action: commit
          committer_branch: dev
          committer_message: "chore(assets): refresh isometric contribution calendar (light)"
          extras_css: |
            svg { background: #f4f5f7 !important; }
            text, tspan { fill: #4a5563 !important; }
            /* Empty (zero-contribution) day tiles: one subtle step off the
               ground so the whole grid floor stays visible. Contribution
               levels L1-L4 keep the plugin's native green. */
            :root { --color-calendar-graph-day-bg: #e5e7eb; }
            [fill="#ebedf0"], [fill="#161b22"] { fill: #e5e7eb !important; }
